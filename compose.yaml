services:
  archive:
    image: ghcr.io/mulholland-inc/archive:latest
    build: .
    ports:
      - "8080:8080"
    volumes:
      - archive:/data
    environment:
      ARCHIVE_LOCALE: ${ARCHIVE_LOCALE:-}
      ARCHIVE_URL: ${ARCHIVE_URL:-http://localhost:3000}
      ARCHIVE_API_URL: ${ARCHIVE_API_URL:-http://localhost:8080}
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    image: ghcr.io/mulholland-inc/archive-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:8080"
    environment:
      ARCHIVE_API_URL: ${ARCHIVE_API_URL:-http://localhost:8080}
    restart: unless-stopped

volumes:
  archive:
