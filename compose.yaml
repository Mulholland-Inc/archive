services:
  archive:
    image: ghcr.io/mulholland-inc/archive:latest
    build: .
    ports:
      - "8080:8080"
    volumes:
      - archive:/data
    environment:
      ARCHIVE_LOCALE: ${ARCHIVE_LOCALE:-}
      ARCHIVE_URL: ${ARCHIVE_URL:-}
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  archive:
