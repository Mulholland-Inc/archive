name: terraform

on:
  push:
    branches: [main]
    paths: [apps/terraform/**, .github/workflows/terraform.yml]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/terraform/gcp
    env:
      TF_IN_AUTOMATION: "1"
      TF_VAR_project: ${{ vars.GCP_PROJECT }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_domain: ${{ vars.ARCHIVE_DOMAIN }}
      TF_VAR_github_repository: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: |
          export CLOUDFLARE_API_TOKEN=$(gcloud secrets versions access latest --secret archive-cloudflare-api-token --project "$TF_VAR_project")
          terraform init -input=false -backend-config=bucket="$TF_VAR_project-tfstate"
          terraform apply -input=false -auto-approve -target=google_secret_manager_secret.this
          for s in $(gcloud secrets list --project "$TF_VAR_project" --filter="name~/secrets/archive-" --format="value(name.basename())"); do
            [ -n "$(gcloud secrets versions list "$s" --project "$TF_VAR_project" --limit 1 --format "value(name)")" ] ||
              printf ' ' | gcloud secrets versions add "$s" --data-file=- --project "$TF_VAR_project"
          done
          terraform apply -input=false -auto-approve
