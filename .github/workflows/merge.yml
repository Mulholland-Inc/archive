name: merge

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

jobs:
  merge:
    name: merge
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.pull_requests[0].number }}
    runs-on: ${{ vars.CI_RUNNER || 'marzy-devbox' }}
    timeout-minutes: 5
    steps:
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23li7MnowhEXjkSkYu
          private-key: ${{ secrets.MARZY_AGENT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: archive
          permission-contents: write
          permission-pull-requests: write
      - run: gh pr merge --squash --match-head-commit "${{ github.event.workflow_run.head_sha }}" "${{ github.event.workflow_run.pull_requests[0].number }}" --repo "${{ github.repository }}" || echo "not mergeable yet; review.yml merges once Jev approves"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
