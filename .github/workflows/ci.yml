name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ vars.CI_RUNNER || 'marzy-devbox' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache: false
      - name: Postgres 18
        run: |
          if [ -x /usr/lib/postgresql/18/bin/initdb ]; then
            echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
            exit 0
          fi
          cache="$HOME/.cache/archive-postgres"
          mkdir -p "$cache"
          (
            flock 9
            if ! ls "$cache"/pgbin/*/bin/initdb >/dev/null 2>&1; then
              (cd src && go build -o "$RUNNER_TEMP/archive" .)
              PATH=/usr/bin:/bin ARCHIVE_DATA="$cache" "$RUNNER_TEMP/archive" types >/dev/null
            fi
          ) 9>"$cache.lock"
          dirname "$(ls "$cache"/pgbin/*/bin/initdb | tail -1)" >> "$GITHUB_PATH"
      - run: go vet ./...
        working-directory: src
      - run: go test -count=1 -timeout 25m ./...
        working-directory: src
