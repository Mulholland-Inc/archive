name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
        working-directory: src
      - run: test -z "$(gofmt -l .)"
        working-directory: src
      - run: go build ./...
        working-directory: src
      - run: go vet ./...
        working-directory: src
      - run: go run . secrets | diff - ../apps/terraform/gcp/secrets.json
        working-directory: src
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: src
  web:
    name: web
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
