name: site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - apps/web/**
      - install.sh
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - run: cp -rL site public

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
