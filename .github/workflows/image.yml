name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ${{ vars.CI_RUNNER || 'marzy-devbox' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - uses: ko-build/setup-ko@v0.9

      - working-directory: src
        env:
          KO_DOCKER_REPO: ghcr.io/mulholland-inc/archive
        run: |
          tags="sha-${GITHUB_SHA::7}"
          [ "$GITHUB_REF" = refs/heads/main ] && tags="$tags,latest"
          case "$GITHUB_REF" in refs/tags/v*) tags="$tags,${GITHUB_REF#refs/tags/v}" ;; esac
          ko build --bare --tags "$tags" --image-label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .

      - id: web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mulholland-inc/archive-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.web.outputs.tags }}
          labels: ${{ steps.web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: image
    if: ${{ github.ref == 'refs/heads/main' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
    runs-on: ${{ vars.CI_RUNNER || 'marzy-devbox' }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - run: |
          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/ghcr/mulholland-inc/archive:sha-${GITHUB_SHA::7}"
          gcloud run services update "$GCP_SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" --image "$image"
          gcloud run jobs update "$GCP_SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" --image "$image"
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_SERVICE: ${{ vars.GCP_SERVICE }}

  app:
    needs: deploy
    if: ${{ vars.CLOUDFLARE_WORKER != '' }}
    runs-on: ${{ vars.CI_RUNNER || 'marzy-devbox' }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_ARCHIVE_API: ${{ vars.ARCHIVE_API_URL }}

      - run: npx --yes wrangler@4 deploy --name "$CLOUDFLARE_WORKER"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER: ${{ vars.CLOUDFLARE_WORKER }}
