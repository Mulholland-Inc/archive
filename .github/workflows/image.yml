name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: marzy-devbox
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - working-directory: src
        run: |
          export KO_DOCKER_REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="sha-${GITHUB_SHA::7}"
          [ "$GITHUB_REF" = refs/heads/main ] && tags="$tags,latest"
          case "$GITHUB_REF" in refs/tags/v*) tags="$tags,${GITHUB_REF#refs/tags/v}" ;; esac
          go run github.com/google/ko@v0.18.1 build --bare --tags "$tags" --image-label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .

  deploy:
    needs: image
    if: ${{ github.ref == 'refs/heads/main' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
    runs-on: marzy-devbox
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - run: |
          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/ghcr/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          gcloud run services update archive --project "$GCP_PROJECT" --region "$GCP_REGION" --image "$image"
          gcloud run jobs update archive --project "$GCP_PROJECT" --region "$GCP_REGION" --image "$image"
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}

  app:
    needs: deploy
    runs-on: marzy-devbox
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
