name: pages

on:
  push:
    branches: [main]
    paths: [apps/site/**, apps/kit/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ vars.CI_RUNNER || 'marzy-devbox' }}
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
        working-directory: apps/site
      - run: npm run build
        working-directory: apps/site
      - uses: actions/configure-pages@v5
      - run: tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" -C apps/site/build .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - id: deployment
        uses: actions/deploy-pages@v4
