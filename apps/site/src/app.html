<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e4e7ec">
<script>
  try {
    if (localStorage.theme === 'dark') {
      document.documentElement.dataset.theme = 'dark';
      document.querySelector('meta[name="theme-color"]').content = '#0b0d12';
    }
  } catch {}
</script>
<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48">
<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png">
<link rel="manifest" href="%sveltekit.assets%/site.webmanifest">
<meta property="og:site_name" content="Archive">
<meta property="og:type" content="website">
<meta property="og:image" content="https://archive.dev/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Archive: own your data infrastructure. An open foundation for your agents to build on.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://archive.dev/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
%sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
<div style="display: contents">%sveltekit.body%</div>
</body>
</html>
