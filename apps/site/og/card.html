<!doctype html>
<!-- The link preview card: what a pasted archive.dev link shows in iMessage, Slack, X, LinkedIn and mail. Run ./render.sh after changing it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500&family=EB+Garamond:wght@500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #e4e7ec; }
  .panel {
    position: absolute; inset: 20px; border-radius: 28px; overflow: hidden;
    background: #f7f8fa; box-shadow: 0 0 0 1px rgba(11, 13, 18, 0.06);
  }
  .copy { position: absolute; left: 64px; top: 64px; bottom: 60px; width: 560px; display: flex; flex-direction: column; }
  .word { width: 172px; height: auto; }
  h1 {
    margin: auto 0 0; font: 500 84px/0.98 "EB Garamond", serif; letter-spacing: -0.025em; color: #0b0d12;
  }
  p { margin: 26px 0 0; text-wrap: balance; font: 500 28px/1.3 "Inter Tight", sans-serif; letter-spacing: -0.01em; color: rgba(11, 13, 18, 0.62); }
  .art { position: absolute; right: -40px; top: 50%; width: 600px; transform: translateY(-50%); }
</style>
</head>
<body>
  <div class="panel">
    <div class="copy">
      <img class="word" src="../../../.github/readme/logo.svg" alt="">
      <h1>Own your data infrastructure.</h1>
      <p>An open foundation for your agents to build on.</p>
    </div>
    <img class="art" src="../static/art/hero.webp" alt="">
  </div>
</body>
</html>
