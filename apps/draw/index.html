<!doctype html>
<meta charset="utf-8">
<title>draw</title>
<style>
  html, body { margin: 0; font: 13px/1.4 system-ui, sans-serif; color: #15161A; background: #ECEEF2; }
  header { display: flex; gap: 14px; align-items: center; padding: 10px 14px; background: #fff; border-bottom: 1px solid #D5D8DE; position: sticky; top: 0; flex-wrap: wrap; }
  label { display: flex; gap: 6px; align-items: center; }
  select, input, button { font: inherit; }
  main { padding: 24px; display: grid; place-items: center; }
  #stage { line-height: 0; }
  #stage.checker { background: repeating-conic-gradient(#E3E5EA 0 25%, #F4F5F7 0 50%) 0 0 / 16px 16px; }
  canvas { display: block; max-width: calc(100vw - 48px); height: auto; }
  #status { color: #6A6F7A; margin-left: auto; }
  pre { color: #B3261E; white-space: pre-wrap; margin: 0; padding: 14px; }
</style>
<header>
  <label>Scene <select id="scene"></select></label>
  <label>Background
    <select id="bg">
      <option value="">transparent</option>
      <option value="#F6F4EC">paper</option>
      <option value="#DCE8F7">sky</option>
      <option value="#FFFFFF">white</option>
    </select>
  </label>
  <label>Line <input id="line" type="number" min="0.5" max="4" step="0.25" value="1" style="width: 56px"></label>
  <label>Supersampling
    <select id="ss"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
  </label>
  <label>Scale
    <select id="scale"><option value="1">1x</option><option value="2">2x</option></select>
  </label>
  <label>Face shading <input id="shade" type="range" min="0" max="1" step="0.05" value="0"></label>
  <label><input id="ao" type="checkbox"> Contact shadow</label>
  <label><input id="watch" type="checkbox" checked> Watch files</label>
  <button id="reload">Render</button>
  <span id="status"></span>
</header>
<pre id="err" hidden></pre>
<main><div id="stage" class="checker"><canvas id="out"></canvas></div></main>
<script type="module" src="preview.js"></script>
