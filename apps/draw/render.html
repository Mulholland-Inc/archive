<!doctype html>
<meta charset="utf-8">
<title>draw render</title>
<style>html, body { margin: 0; background: transparent; }</style>
<script type="module">
import { bake, icon } from './render.js';
const png = fn => async (...args) => {
  try {
    return { png: await fn(...args) };
  } catch (e) {
    return { error: e.message };
  }
};
window.bake = png(bake);
window.icon = png(icon);
</script>
