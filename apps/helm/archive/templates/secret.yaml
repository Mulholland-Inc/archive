{{- if not .Values.existingSecret }}
{{- if and .Values.database.url (not .Values.secretKey) }}
{{- fail "secretKey is required with database.url" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "archive.fullname" . }}
  labels:
    {{- include "archive.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secretKey }}
  ARCHIVE_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.database.url }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
