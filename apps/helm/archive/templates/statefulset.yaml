apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "archive.fullname" . }}
  labels:
    {{- include "archive.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "archive.fullname" . }}
  selector:
    matchLabels:
      {{- include "archive.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "archive.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        runAsNonRoot: true
        fsGroup: 70
      containers:
        - name: archive
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ARCHIVE_DATA
              value: /data
            {{- with .Values.url }}
            - name: ARCHIVE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.apiUrl }}
            - name: ARCHIVE_API_URL
              value: {{ . | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "archive.secretName" . }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
