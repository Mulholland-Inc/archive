<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <title>Archive</title>
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <script>
      (function () {
        var t = localStorage.getItem('archive.theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
      (function () {
        window.API = location.hostname.startsWith('app.') ? location.origin.replace('//app.', '//api.') : '';
        if (location.pathname === '/authorize') return;
        var named = new URLSearchParams(location.search).get('workspace');
        try {
          named = named || localStorage.getItem('workspace');
        } catch (e) {}
        window.boot = fetch(window.API + '/api/boot', { credentials: 'include', headers: named ? { 'Archive-Workspace': named } : {} });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
